# docker-compose.cloudflare.yml
# Cloudflare emulation overlay: run `wrangler dev --local --port 8787` separately,
# then `docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up`.
# The container reaches KV/D1/Vectorize via the host-mapped wrangler dev worker.
services:
  wet-mcp:
    build: .
    environment:
      - MCP_TRANSPORT=http
      - MCP_STORAGE_BACKEND=cf-kv
      - MCP_KV_BASE_URL=http://host.docker.internal:8787/kv
      - DOCS_DB_BACKEND=cf-d1
      - MCP_D1_BASE_URL=http://host.docker.internal:8787/d1.internal
      - MCP_VECTORIZE_BASE_URL=http://host.docker.internal:8787/vectorize.internal
      - MCP_VECTORIZE_IDX=wet-docs-vectors
      - EMBEDDING_MODELS=jina_ai/jina-embeddings-v5-text-small
      - RERANK_MODELS=jina_ai/jina-reranker-v3
      - SEARCH_BACKEND=tavily
      - PUBLIC_URL=http://localhost:8787
      - CREDENTIAL_SECRET=${CREDENTIAL_SECRET}
      - JINA_AI_API_KEY=${JINA_AI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    ports:
      - "8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
