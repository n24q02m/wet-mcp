[project]
name = "wet-mcp"
version = "2.24.0"
description = "Open-source MCP Server for web search, extract, crawl, academic research, and library docs with embedded SearXNG"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "n24q02m", email = "quangminh2422004@gmail.com" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "web-scraping", "searxng", "crawl4ai", "library-docs", "claude", "cursor", "copilot", "antigravity", "codex", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    # Shared web infrastructure (SSRF, SearXNG, URL utils)
    "n24q02m-web-core>=1.1.0",
    # MCP Server
    "mcp[cli]",
    # Web Crawling
    "crawl4ai",
    # HTTP Client
    "httpx",
    # Config
    "pydantic",
    "pydantic-settings",
    # Logging
    "loguru",
    # LLM + Embedding (native SDKs)
    "cohere>=5.21.1",
    "httpx>=0.28.1",
    "google-genai>=1.68.0",
    "openai>=2.30.0",
    # Vector search for docs
    "sqlite-vec",
    # Local ONNX embedding + reranking (auto-fallback when no cloud API)
    "qwen3-embed>=1.6.0",

    "pillow>=12.1.1",
    "diskcache>=5.6.3",
    "cryptography>=46.0.6",
    # Document conversion (PDF, DOCX, PPTX → Markdown)
    "markitdown[pdf,docx,pptx,xlsx]",
    # Schema validation for structured extraction
    "jsonschema>=4.26.0",
    # Per-domain rate limiting for batch operations
    "aiolimiter>=1.2.1",
    # Relay setup (zero-env-config)
    "mcp-relay-core>=1.4.0",
    # Google Drive sync
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    # Production WSGI server for embedded SearXNG on Windows
    # (Werkzeug dev server deadlocks under concurrent engine requests)
    "waitress>=3.0.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
    "ty",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "syrupy>=5.1.0",
]

[project.scripts]
wet-mcp = "wet_mcp:main"

[project.urls]
Homepage = "https://github.com/n24q02m/wet-mcp"
Repository = "https://github.com/n24q02m/wet-mcp.git"
Issues = "https://github.com/n24q02m/wet-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/wet_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "src/wet_mcp/**/*.py",
    "src/wet_mcp/**/*.yml",
    "src/wet_mcp/**/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 30
markers = [
    "integration: integration tests (require network/services)",
    "live: live MCP protocol tests (spawn real server via stdio)",
    "network: tests requiring network access",
    "full: full live tests with real services",
    "e2e: end-to-end tests (3 setup modes: relay, env, plugin)",
    "slow: slow tests (crawl, download, etc.)",
]
addopts = "-m 'not integration and not live and not full and not e2e'"

[tool.uv.sources]
mcp-relay-core = { path = "../mcp-relay-core/packages/core-py", editable = true }

[tool.ty]
rules = { unresolved-import = "ignore", unresolved-attribute = "ignore", possibly-missing-attribute = "ignore" }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", "server.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/wet_mcp"]
branch = true

[tool.coverage.report]
fail_under = 94
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
